name: vynor-crm

# NF-08: MinIO no longer publishes minio/minio or minio/mc. PGSTY Silo is a MinIO fork with the
# same S3 API, /minio/health/live, MINIO_ROOT_* variables and `server` command; it ships mcli.
# Pinned to the registry-verified multi-arch index digest (linux/amd64 and linux/arm64).
x-storage-image: &storage_image 'docker.io/pgsty/silo:RELEASE.2026-10-15T00-00-00Z@sha256:aaac6bce13eb99316b3c88bd20143fc3c38ab607585256a411a095c44ee57f62'

# WU-04 / DEC-04: Redis 7, pinned to the registry-verified multi-arch index digest.
x-redis-image: &redis_image 'docker.io/library/redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499'

networks:
  vynor-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  caddy_data:
  caddy_config:

services:
  # 1. PostgreSQL Database with pgvector extension (FND-018, FND-023)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vynor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vynor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vynor-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vynor']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. RustFS / S3-Compatible Object Store (FND-071..075, AD-010)
  rustfs:
    image: *storage_image
    container_name: vynor-rustfs
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vynor_storage_admin
      MINIO_ROOT_PASSWORD: vynor_storage_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs_data:/data
    networks:
      - vynor-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. RustFS Bucket Provisioning Helper
  rustfs-init:
    image: *storage_image
    container_name: vynor-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - vynor-network
    # Idempotent (--ignore-existing); fails when a bucket is still missing instead of exiting 0.
    entrypoint: >
      /bin/sh -c "
      set -eu;
      mcli alias set storage http://rustfs:9000 vynor_storage_admin vynor_storage_secret;
      for bucket in vynor-crm-attachments vynor-crm-attachments-quarantine; do
      mcli mb --ignore-existing storage/$$bucket;
      mcli stat storage/$$bucket >/dev/null;
      done;
      echo 'Storage buckets ready';
      "

  # 4. Backend NestJS REST API & Realtime Gateway (FND-BE-001, FND-INF-001)
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: vynor-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_URL: http://localhost:3001
      CORS_ALLOWED_ORIGINS: 'http://localhost:3000,http://localhost:80,http://localhost'
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/vynor?schema=public'
      DIRECT_URL: 'postgresql://postgres:postgres@postgres:5432/vynor?schema=public'
      SUPABASE_URL: 'http://localhost:54321'
      SUPABASE_ANON_KEY: 'dev-anon-key-placeholder'
      SUPABASE_SERVICE_ROLE_KEY: 'dev-service-role-key-placeholder'
      SUPABASE_JWT_SECRET: 'dev-supabase-jwt-secret-for-local-testing-only-32-chars'
      STORAGE_ENDPOINT: 'http://rustfs:9000'
      STORAGE_REGION: 'us-east-1'
      STORAGE_BUCKET: 'vynor-crm-attachments'
      STORAGE_ACCESS_KEY_ID: 'vynor_storage_admin'
      STORAGE_SECRET_ACCESS_KEY: 'vynor_storage_secret'
      STORAGE_USE_SSL: 'false'
      # Channels: encrypts stored credentials (openssl rand -base64 32; same value for the worker)
      # and sets the public HTTPS origin providers call. Blank = not set.
      ENCRYPTION_MASTER_KEY: '${ENCRYPTION_MASTER_KEY:-}'
      PUBLIC_WEBHOOK_BASE_URL: '${PUBLIC_WEBHOOK_BASE_URL:-}'
      # Idempotency-Key records and web chat rate limits, shared by every API instance (WU-04).
      # URL-encode the password here if it contains reserved characters.
      REDIS_URL: 'redis://:${REDIS_PASSWORD:-vynor_redis_dev_secret}@redis:6379/0'
    ports:
      - '3001:3001'
    networks:
      - vynor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      # The API serves health under its global prefix only; /health/live returns 404.
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3001/api/v1/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 5. Background Worker & Outbox Dispatcher (FND-BE-002, FND-051..060)
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: vynor-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/vynor?schema=public'
      DIRECT_URL: 'postgresql://postgres:postgres@postgres:5432/vynor?schema=public'
      PG_BOSS_SCHEMA: 'pgboss'
      PG_BOSS_RETENTION_DAYS: 14
      STORAGE_ENDPOINT: 'http://rustfs:9000'
      STORAGE_REGION: 'us-east-1'
      STORAGE_BUCKET: 'vynor-crm-attachments'
      STORAGE_ACCESS_KEY_ID: 'vynor_storage_admin'
      STORAGE_SECRET_ACCESS_KEY: 'vynor_storage_secret'
      STORAGE_USE_SSL: 'false'
      # Channels: must match the API key to decrypt credentials for replies and polling.
      ENCRYPTION_MASTER_KEY: '${ENCRYPTION_MASTER_KEY:-}'
      # BullMQ job queues (WU-05a, DEC-02); pg-boss above only drains jobs from before the
      # cutover. URL-encode the password here if it contains reserved characters.
      REDIS_URL: 'redis://:${REDIS_PASSWORD:-vynor_redis_dev_secret}@redis:6379/0'
    networks:
      - vynor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # Fails once the worker stops writing heartbeats (blocked event loop, BullMQ's Redis down
      # or hung, or database lost). A pg-boss drain that cannot start does not fail it (Q-05A-1).
      test: ['CMD-SHELL', 'node apps/worker/dist/healthcheck.js || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 6. Frontend Next.js Web Application (FND-FE-001..007)
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: vynor-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NEXT_PUBLIC_API_URL: 'http://localhost:3001'
      NEXT_PUBLIC_SOCKET_URL: 'http://localhost:3001'
      NEXT_PUBLIC_SUPABASE_URL: 'http://localhost:54321'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dev-anon-key-placeholder'
    ports:
      - '3000:3000'
    networks:
      - vynor-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 7. Caddy Edge Reverse Proxy with TLS & Upload Limiting (FND-INF-004)
  caddy:
    image: caddy:2.8-alpine
    container_name: vynor-caddy
    restart: unless-stopped
    environment:
      DOMAIN: 'localhost'
      TLS_MODE: 'internal'
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vynor-network
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Caddy only listens on HTTPS (:443; auto_https disable_redirects, so no :80 listener).
      # The probe verifies the certificate against Caddy's internal root CA (TLS_MODE internal)
      # instead of skipping verification. Switching TLS_MODE to ACME needs a different probe.
      test:
        [
          'CMD-SHELL',
          'SSL_CERT_FILE=/data/caddy/pki/authorities/local/root.crt wget --no-verbose --tries=1 --spider https://localhost/api/v1/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 8. Redis for state shared by API instances: Idempotency-Key records and web chat rate
  # limits (WU-04, DEC-04), and the worker's BullMQ job queues (WU-05a, DEC-02). AOF with fsync
  # every second; noeviction (which BullMQ requires), so a full Redis refuses writes and the API
  # fails closed (503) instead of silently losing keys; a password; and no published port, so
  # only services on vynor-network reach it.
  redis:
    image: *redis_image
    container_name: vynor-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - '${REDIS_MAXMEMORY:-256mb}'
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - '${REDIS_PASSWORD:-vynor_redis_dev_secret}'
    environment:
      # Read by the health check (and redis-cli in the smoke); the server takes --requirepass.
      REDIS_PASSWORD: '${REDIS_PASSWORD:-vynor_redis_dev_secret}'
    volumes:
      - redis_data:/data
    networks:
      - vynor-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
