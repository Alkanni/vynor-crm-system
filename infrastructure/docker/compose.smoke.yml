# Isolated compose smoke overlay (WU-01, VYN-01-03).
#
# Never use this file directly. Run infrastructure/scripts/compose-smoke.sh, which pins the
# project name to vynor-wu01-smoke, sanitizes the environment, renders and checks the final
# config before any state change, and only tears down resources owned by that project.
#
# Against the default stack in docker-compose.yml (project vynor-crm, fixed container names,
# database vynor) this overlay:
# - resets container_name, so containers, volumes, network and built images all carry the
#   vynor-wu01-smoke prefix and never collide with (or recreate) the live vynor-* containers;
# - points PostgreSQL, the API and the worker at the test database vynor_test on the smoke
#   PostgreSQL (service DNS name postgres, internal port 5432);
# - replaces every published port with a 127.0.0.1-only port from smoke.env (internal ports
#   and service names stay the same); Caddy publishes HTTPS only, it has no HTTP listener;
# - disables restarts, so a forgotten smoke stack does not come back after a reboot;
# - blanks the channel secrets the base file reads from the environment.
x-smoke-db-url: &smoke_db_url 'postgresql://postgres:postgres@postgres:5432/vynor_test?schema=public'

services:
  postgres:
    container_name: !reset null
    restart: 'no'
    environment:
      POSTGRES_DB: vynor_test
    ports: !override
      - '127.0.0.1:${SMOKE_POSTGRES_PORT:?set in smoke.env}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vynor_test']

  # No ports: the smoke reaches Redis with `compose exec`, as only vynor-network can.
  redis:
    container_name: !reset null
    restart: 'no'

  rustfs:
    container_name: !reset null
    restart: 'no'
    ports: !override
      - '127.0.0.1:${SMOKE_RUSTFS_API_PORT:?set in smoke.env}:9000'
      - '127.0.0.1:${SMOKE_RUSTFS_CONSOLE_PORT:?set in smoke.env}:9001'

  rustfs-init:
    container_name: !reset null

  api:
    container_name: !reset null
    restart: 'no'
    environment:
      DATABASE_URL: *smoke_db_url
      DIRECT_URL: *smoke_db_url
      ENCRYPTION_MASTER_KEY: ''
      PUBLIC_WEBHOOK_BASE_URL: ''
    ports: !override
      - '127.0.0.1:${SMOKE_API_PORT:?set in smoke.env}:3001'

  worker:
    container_name: !reset null
    restart: 'no'
    environment:
      DATABASE_URL: *smoke_db_url
      DIRECT_URL: *smoke_db_url
      ENCRYPTION_MASTER_KEY: ''

  web:
    container_name: !reset null
    restart: 'no'
    ports: !override
      - '127.0.0.1:${SMOKE_WEB_PORT:?set in smoke.env}:3000'

  caddy:
    container_name: !reset null
    restart: 'no'
    ports: !override
      - '127.0.0.1:${SMOKE_CADDY_HTTPS_PORT:?set in smoke.env}:443'
