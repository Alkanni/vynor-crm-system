name: CI Quality Gate & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Formatting Check
        run: pnpm format:check

      - name: Monorepo Linting
        run: pnpm lint

      - name: Monorepo Typechecking
        run: pnpm typecheck

      - name: Monorepo Production Build
        run: pnpm build

  migration-and-drift:
    name: Migration Drift & Schema Invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vynor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @vynor/database db:generate

      - name: Verify Migration Drift (Prisma Schema vs Migrations)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=shadow
        run: pnpm --filter @vynor/database db:migrate:diff

      - name: Validate Migration Deployment to PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
        run: pnpm --filter @vynor/database db:migrate:deploy

      - name: Verify Database Schema Rules & Constraints
        run: pnpm --filter @vynor/database db:verify

  verification-suites:
    name: Application Verification Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Packages
        run: pnpm build

      - name: Verify Backend Core Foundation
        run: pnpm --filter @vynor/api verify

      - name: Verify Frontend Foundation
        run: pnpm --filter @vynor/web verify

      - name: Verify Infrastructure & DevOps Configuration
        run: pnpm infra:verify

  automated-tests:
    name: Automated Unit & Integration Tests (Vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vynor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Packages
        run: pnpm build

      - name: Deploy Migrations to Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
        run: pnpm --filter @vynor/database db:migrate:deploy

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
        run: pnpm --filter @vynor/database db:seed

      - name: Run Test Suites
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vynor_test?schema=public
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: anon-key-for-test-suites
          SUPABASE_SERVICE_ROLE_KEY: service-role-key-for-test-suites
          SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-chars
          STORAGE_ACCESS_KEY_ID: rustfsadmin
          STORAGE_SECRET_ACCESS_KEY: rustfsadminpassword
        run: pnpm test
